name: Build LyricSky

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.2"
            loader: "0.19.3"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            loader: "0.19.5"
            fabric_api: "0.165.0+26.3"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build mod
        run: >
          gradle --no-daemon build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: lyricsky-minecraft-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
